name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    env:
      NUGET_PACKAGE_VERSION: 0.1.${{ github.run_number }}-ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet format src/LancerNexus.Cluster/LancerNexus.Cluster.csproj --verify-no-changes --no-restore
      - run: dotnet format tests/LancerNexus.Cluster.Tests/LancerNexus.Cluster.Tests.csproj --verify-no-changes --no-restore
      - run: dotnet build --configuration Release --no-restore --warnaserror
      - run: dotnet test --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage"
      - run: dotnet pack Protocol/src/LancerNexus.Protocol/LancerNexus.Protocol.csproj --configuration Release --no-restore --output "${{ runner.temp }}/nexus-packages" -p:PackageVersion="$NUGET_PACKAGE_VERSION"
      - run: dotnet pack src/LancerNexus.Cluster/LancerNexus.Cluster.csproj --configuration Release --no-restore --output "${{ runner.temp }}/nexus-packages" -p:PackageVersion="$NUGET_PACKAGE_VERSION"
      - run: unzip -p "${{ runner.temp }}/nexus-packages/LancerNexus.Cluster.$NUGET_PACKAGE_VERSION.nupkg" '*.nuspec' | grep -F "<dependency id=\"LancerNexus.Protocol\" version=\"$NUGET_PACKAGE_VERSION\""
      - uses: actions/upload-artifact@v4
        with:
          name: lancer-nexus-cluster-packages-${{ github.run_number }}
          path: ${{ runner.temp }}/nexus-packages/*.nupkg
          if-no-files-found: error
          retention-days: 14
